[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "documentvision-multimodal-benchmark"
version = "1.0.0"
description = "Multimodal Document Intelligence Benchmark: OCR Pipeline vs Vision-Language Models on Dense Tables, Charts, and Layout Grounding"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scipy>=1.9.0",
    "pillow>=9.0.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
documentvision = "documentvision.cli:main"

[tool.setuptools.packages.find]
include = ["documentvision*"]
